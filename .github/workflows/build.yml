name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "28.2.13676358"

jobs:
  core-check:
    name: Rust core (host check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --lib --bin hori
      - name: cargo clippy
        run: cargo clippy --lib --bin hori -- -D warnings

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: core-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version ^3 --locked

      - name: Build native libraries
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release --lib

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hori-torrent-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hori-torrent-debug-apk
          path: dist
      - name: Rename APK
        run: |
          cd dist
          for f in *.apk; do mv "$f" "hori-torrent-${GITHUB_REF_NAME}.apk"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
