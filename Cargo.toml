[package]
name = "hori-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hori Torrent core: BitTorrent engine (librqbit) with a JNI bridge for Android"

[lib]
name = "hori_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "hori"
path = "src/bin/hori.rs"

[dependencies]
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[target.'cfg(target_os = "android")'.dependencies]
# Must match the jni major used by rustls-platform-verifier (0.22) so JNIEnv
# types are interchangeable.
jni = "0.22"
log = "0.4"
android_logger = "0.15"
tracing-log = "0.2"
# Required to initialize the Android certificate verifier used by reqwest's
# rustls backend; without it every HTTPS tracker announce fails.
rustls-platform-verifier = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"
