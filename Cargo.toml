[package]
name = "hori-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hori Torrent core: BitTorrent engine (librqbit) with a JNI bridge for Android"

[lib]
name = "hori_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "hori"
path = "src/bin/hori.rs"

[dependencies]
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
log = "0.4"
android_logger = "0.15"
tracing-log = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"
